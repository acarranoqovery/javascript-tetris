server {
    listen       80;
    server_name  localhost;

    root /www;
    index index.html;

    # Gzip text assets to cut egress and speed up first paint. Binary assets
    # that are already compressed (e.g. the JPG texture) are left untouched.
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_vary         on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Long-cache fingerprint-free static assets to remove repeat downloads
    # (and the egress they cost) on return visits.
    location ~* \.(js|jpg|jpeg|png|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
