server {
    listen       80;
    server_name  localhost;

    root /www;
    index index.html;

    # Gzip text assets on the fly. index.html (~18 KB) compresses to ~5 KB,
    # cutting transfer size — and egress cost — on every page load.
    # (Binary assets like the JPG are already compressed, so they're excluded.)
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets so repeat visits (and any CDN/browser in front) skip
    # re-downloading them. texture.jpg never changes; JS/CSS get a shorter TTL
    # so an update still propagates quickly.
    location ~* \.(?:jpg|jpeg|png|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location ~* \.(?:js|css)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
